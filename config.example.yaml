# Recommended: run `python3 setup.py` instead of editing this by hand — it
# will interactively ask for your location (GPS or a Plus Code), preferred
# units, and ntfy settings, and write config.yaml for you.
#
# This file documents the format if you'd rather copy it to config.yaml and
# fill it in manually.

location:
  name: "New York"
  latitude: 40.68922388147081
  longitude: -74.04448846124427
  timezone: "America/New_York"

# "celsius" or "fahrenheit". Controls both the units fetched from the weather
# API and which threshold keys below are used (temp_high_celsius/
# wind_speed_kmh vs temp_high_fahrenheit/wind_speed_mph).
units: celsius

# Which weather data source to use. "open-meteo" (default) needs no API key.
# The other three need a free key from the provider (see README for signup
# links) - add it as `api_key:` below.
#
# Note: only Open-Meteo provides a real "dust" concentration and a numeric
# 0-500 US AQI. The other providers give PM10/PM2.5 concentrations (so those
# threshold checks still work), but their own air-quality indices use
# different scales, so `dust`/`us_aqi` alerts are always skipped (not faked)
# when using them.
weather_provider:
  name: open-meteo   # open-meteo | openweathermap | weatherapi | tomorrowio
  # api_key: ""       # required for any provider other than open-meteo

ntfy:
  server: "https://ntfy.example.com"   # or "https://ntfy.sh" for the public service
  topic: "weather-alerts"
  # Optional: set if your ntfy server requires auth
  # username: ""
  # password: ""
  # token: ""

# Alert thresholds
thresholds:
  precipitation_probability_percent: 50   # alert if any forecast hour exceeds this
  precipitation_mm: 1.0                   # alert if hourly rain volume exceeds this
  thunderstorm: true                      # alert on any forecast thunderstorm (weathercode 95-99)

  # Use the pair matching `units:` above.
  temp_high_celsius: 35.0                 # alert if forecast max temp exceeds this
  temp_low_celsius: 5.0                   # alert if forecast min temp drops below this
  wind_speed_kmh: 60.0                    # alert on strong wind gusts
  # temp_high_fahrenheit: 95.0
  # temp_low_fahrenheit: 41.0
  # wind_speed_mph: 37.3

  # Air quality (Open-Meteo Air Quality API) - unit-independent
  pm10: 100.0        # WHO/EU "poor" threshold, ug/m3
  pm2_5: 50.0         # ug/m3
  us_aqi: 100          # US AQI "Unhealthy for Sensitive Groups" and above
  dust: 50.0           # ug/m3, dust concentration (relevant for Middle East dust storms)

# How many hours ahead to look at in the forecast
forecast_hours: 24

# Avoid re-sending the same alert repeatedly within this many minutes
alert_cooldown_minutes: 180

# Daily push with today's and tomorrow's forecast (weather emoji, high/low
# temp, chance of rain, sunrise/sunset), sent to the same ntfy topic as
# alerts. Checked on every scheduled run, so actual delivery can lag `time`
# by up to your scheduling interval.
#
# Sunrise/sunset: if the active weather_provider doesn't supply a real
# per-day value (currently only OpenWeatherMap's free tier doesn't), one
# extra free/keyless call is made to Open-Meteo for just that data.
daily_digest:
  enabled: true
  time: "07:00"          # always 24-hour HH:MM internally, in the location's timezone
  time_format: "24h"     # "24h" or "12h" - purely a display preference: how
                         # `time` was entered in setup.py, and how sunrise/
                         # sunset are shown in the digest message
